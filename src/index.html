<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎲 Mi Biblioteca de Juegos</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#0e0e12;color:#ddd;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    min-height:100vh;
    background-image:radial-gradient(ellipse at 50% 0%,#1a1a2e 0%,transparent 60%);
  }
  header{
    padding:28px 20px 20px;text-align:center;
    border-bottom:1px solid #1e1e2e;
    background:linear-gradient(180deg,#12121e 0%,#0e0e12 100%);
  }
  .header-icon{font-size:36px;margin-bottom:8px}
  .header-title{font-size:24px;font-weight:700;color:#fff;letter-spacing:1px}
  .header-sub{font-size:12px;color:#556;letter-spacing:2px;text-transform:uppercase;margin-top:4px}

  .search-bar{padding:14px 20px;border-bottom:1px solid #1a1a28}
  .search-input{
    width:100%;background:#161620;border:1px solid #252535;color:#ccc;
    padding:10px 14px;font-size:14px;border-radius:8px;outline:none;
    font-family:-apple-system,sans-serif;
  }
  .search-input:focus{border-color:#4a4a8a}
  .search-input::placeholder{color:#3a3a55}

  .filters{display:flex;gap:6px;padding:12px 20px;border-bottom:1px solid #1a1a28;flex-wrap:wrap}
  .filter-btn{
    background:#161620;border:1px solid #252535;color:#667;
    padding:5px 12px;border-radius:20px;cursor:pointer;font-size:11px;
    transition:all 0.15s;letter-spacing:0.5px;
  }
  .filter-btn.active{background:#2a2a4a;border-color:#5555aa;color:#aac}

  .games-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:14px;padding:20px;
  }
  .game-card{
    background:#131318;border:1px solid #1e1e2e;border-radius:12px;
    overflow:hidden;transition:all 0.2s;cursor:pointer;text-decoration:none;display:block;
  }
  .game-card:hover{border-color:#3a3a6a;transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.4)}
  .game-card.locked{opacity:0.45;cursor:default;pointer-events:none}
  .game-card-banner{
    height:80px;display:flex;align-items:center;justify-content:center;
    font-size:42px;position:relative;overflow:hidden;
  }
  .game-card-body{padding:14px}
  .game-name{font-size:16px;font-weight:700;color:#eee;margin-bottom:4px}
  .game-subtitle{font-size:11px;color:#556;margin-bottom:10px;letter-spacing:0.5px}
  .game-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .meta-pill{
    font-size:10px;padding:3px 8px;border-radius:10px;
    background:#1a1a28;border:1px solid #252535;color:#778;
  }
  .game-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
  .tag{font-size:9px;padding:2px 7px;border-radius:4px;letter-spacing:0.5px}
  .game-btn{
    display:block;text-align:center;padding:8px;border-radius:7px;
    font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;
    text-decoration:none;transition:all 0.15s;border:1px solid transparent;
  }
  .game-btn:hover{opacity:0.9}
  .badge-new{
    position:absolute;top:8px;right:8px;background:#e8c84a;color:#000;
    font-size:8px;font-weight:700;padding:2px 7px;border-radius:10px;
    letter-spacing:1px;text-transform:uppercase;
  }
  .badge-exp{
    position:absolute;top:8px;left:8px;
    font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;
    letter-spacing:1px;text-transform:uppercase;
  }
  .section-header{
    padding:6px 20px;font-size:10px;color:#335;letter-spacing:3px;
    text-transform:uppercase;border-bottom:1px solid #131320;
    background:#0b0b10;
  }
  .count{font-size:11px;color:#445;padding:10px 20px 0;letter-spacing:1px}
  .no-results{text-align:center;padding:50px 20px;color:#333;font-size:13px}
</style>
</head>
<body>

  <button class="filter-btn" onclick="setFilter('campaña',this)">Campaña</button>

let activeFilter = 'all';

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const container = document.getElementById('games-container');

  const filtered = games.filter(g => {
    const matchQ = !q || g.name.toLowerCase().includes(q) || g.subtitle.toLowerCase().includes(q);
    const matchF = activeFilter === 'all' || g.type.includes(activeFilter);
    return matchQ && matchF;
  });

  if (!filtered.length) {
    container.innerHTML = '<div class="no-results">No se encontraron juegos.</div>';
    return;
  }

  const available = filtered.filter(g => g.available);
  const unavailable = filtered.filter(g => !g.available);

  let html = '';

  if (available.length) {
    html += '<div class="count">' + available.length + ' juego' + (available.length !== 1 ? 's' : '') + ' disponible' + (available.length !== 1 ? 's' : '') + '</div>';
    html += '<div class="games-grid">';
    available.forEach(g => { html += cardHTML(g); });
    html += '</div>';
  }

  if (unavailable.length) {
    html += '<div class="section-header">Próximamente</div>';
    html += '<div class="games-grid">';
    unavailable.forEach(g => { html += cardHTML(g); });
    html += '</div>';
  }

  container.innerHTML = html;
}

function cardHTML(g) {
  const tag = g.tags.map(t =>
    `<span class="tag" style="background:${t.bg};border:1px solid ${t.border};color:${t.color}">${t.label}</span>`
  ).join('');

  const badge = g.isNew ? '<span class="badge-new">NUEVO</span>' : '';
  const expBadge = g.isExp ? `<span class="badge-exp" style="background:${g.expBg};color:#fff">${g.expLabel}</span>` : '';

  const btn = g.available
    ? `<a href="${g.file}" class="game-btn" style="background:${g.btnBg};color:${g.btnColor}">Ver Guía →</a>`
    : `<span class="game-btn" style="background:#1a1a1a;color:#555;border-color:#222;cursor:default">Próximamente</span>`;

  return `
    <div class="game-card${g.available ? '' : ' locked'}">
      <div class="game-card-banner" style="background:${g.banner}">
        <span style="font-size:44px">${g.icon}</span>
        ${badge}${expBadge}
      </div>
      <div class="game-card-body">
        <div class="game-name">${g.name}</div>
        <div class="game-subtitle">${g.subtitle}</div>
        <div class="game-meta">
          <span class="meta-pill">👥 ${g.players}</span>
          <span class="meta-pill">⏱ ${g.time}</span>
          <span class="meta-pill">🎯 ${g.difficulty}</span>
        </div>
        <div class="game-tags">${tag}</div>
        ${btn}
      </div>
    </div>`;
}

render();
</script>

</html>
